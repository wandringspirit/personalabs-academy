    POSTS.forEach(post => {

          </div>
          <div class="path-box">📁 File: ${post.videoFile}</div>
          <div class="caption-preview">${post.caption}</div>

            <a href="https://business.facebook.com/latest/composer?asset_id=1338150602718052&business_id=1761523878300294&context_ref=CONTENT_CALENDAR" target="_blank" class="btn-copy" style="text-decoration:none; text-align:center;">🚀 Open Composer ↗</a>
          </div>
          <label class="check-scheduled">
            <input type="checkbox" onchange="toggleScheduled('${post.id}', this.checked)" ${isSched ? "checked" : ""}> Mark as Scheduled
          </label>
        </div>
      `;
      grid.appendChild(card);
    });

    function copyCaption(id, btn) {
      const p = POSTS.find(x => x.id === id);
      if (!p) return;
      navigator.clipboard.writeText(p.caption).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = "✅ Copied to Clipboard!";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.innerHTML = orig;
          btn.classList.remove("copied");
        }, 2200);
      });
    }

    function toggleScheduled(id, checked) {
      localStorage.setItem("sched_" + id, checked ? "true" : "false");
      const card = document.getElementById("card_" + id);
      if (card) {
        if (checked) card.classList.add("is-scheduled");
        else card.classList.remove("is-scheduled");
      }
    }
